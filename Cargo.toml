[package]
name = "migration-lock-rehearsal"
version = "0.1.0"
edition = "2021"
description = "Rehearse a migration in a disposable Docker database"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-migration-lock-rehearsal"
readme = "README.md"
include = ["/src-cli/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE", "/.factory/demo.md"]

[[bin]]
name = "mlr"
path = "src-cli/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
